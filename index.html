<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contrivance Image AI — Free Unlimited AI Image Generator</title>
  <meta name="description" content="Contrivance Image AI — a ChatGPT-style chat interface for generating unlimited AI images for free. No signup, no API key, no limits." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-mark">✨</span>
          <span class="brand-name">Contrivance<br /><span class="accent">Image AI</span></span>
        </div>
        <button id="closeSidebarBtn" class="icon-btn mobile-only" title="Close sidebar">✕</button>
      </div>

      <button id="newChatBtn" class="new-chat-btn">
        <span>+</span> New chat
      </button>

      <nav class="chat-list" id="chatList" aria-label="Chat history"></nav>

      <div class="sidebar-footer">
        <button id="clearAllBtn" class="text-link">🗑 Clear all chats</button>
        <p class="footnote">Free &amp; unlimited · powered by open diffusion models</p>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main">
      <header class="chat-topbar">
        <button id="openSidebarBtn" class="icon-btn mobile-only" title="Open sidebar">☰</button>
        <div class="topbar-title" id="topbarTitle">New chat</div>
        <button id="settingsBtn" class="icon-btn" title="Generation settings">⚙️</button>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="welcome" id="welcome">
          <div class="welcome-mark">✨</div>
          <h1>Contrivance <span class="accent">Image AI</span></h1>
          <p>Describe anything. Get unlimited free AI-generated images — no signup, no API key, no limits.</p>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div id="settingsPanel" class="settings-panel hidden">
          <div class="settings-panel-header">
            <strong>Generation settings</strong>
            <button id="closeSettingsBtn" class="icon-btn" title="Close">✕</button>
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field-label" for="model">Model</label>
              <select id="model">
                <option value="turbo" selected>Turbo (fastest, SDXL-turbo based, default)</option>
                <option value="flux">Flux (best quality, slower)</option>
                <option value="flux-realism">Flux Realism (photoreal)</option>
                <option value="flux-anime">Flux Anime</option>
                <option value="flux-3d">Flux 3D</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="ratio">Aspect ratio</label>
              <select id="ratio">
                <option value="1024x1024" selected>Square (1024×1024)</option>
                <option value="1024x1536">Portrait (1024×1536)</option>
                <option value="1536x1024">Landscape (1536×1024)</option>
                <option value="1024x1792">Tall (1024×1792)</option>
                <option value="1792x1024">Wide (1792×1024)</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field-label" for="seed">Seed</label>
              <div class="seed-row">
                <input type="number" id="seed" placeholder="Random" min="0" />
                <button type="button" id="randomSeedBtn" class="icon-btn" title="Randomize seed">🔀</button>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="count">Batch size</label>
              <select id="count">
                <option value="1" selected>1 image</option>
                <option value="2">2 images</option>
                <option value="4">4 images</option>
              </select>
            </div>
          </div>

          <label class="checkbox-row">
            <input type="checkbox" id="noLogo" checked />
            <span>Remove watermark (when available)</span>
          </label>
        </div>

        <div class="composer">
          <button id="settingsToggle" class="composer-icon-btn" title="Generation settings">⚙️</button>
          <textarea
            id="promptInput"
            rows="1"
            placeholder="Describe an image to generate, e.g. 'a red panda reading a book'…"
          ></textarea>
          <button id="sendBtn" class="send-btn" title="Generate" disabled>➤</button>
        </div>
        <p class="composer-hint">Enter to send · Shift+Enter for a new line · Fair-use only, please.</p>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js?v=3"></script>
</body>
</html>
